services:
  mongodb:
    image: mongo:7.0
    container_name: emit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mobsf:
    image: emit-analysis:latest
    build:
      context: .
      dockerfile: Dockerfile.analysis
    container_name: emit-mobsf
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - MOBSF_API_KEY=emit_mobsf_secret_api_key_2026
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  mongo_data:
    driver: local
